<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C.H.O.S.E. | Halloween Night 2026</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #08070b;
            color: #f5f2f7;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(118, 55, 180, 0.16),
                    transparent 45%
                );

            pointer-events: none;
        }


        /* =========================
           MAIN COVER
        ========================= */

        .cover {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px 20px;

            position: relative;
        }


        .cover-content {
            width: 100%;
            max-width: 700px;

            position: relative;
            z-index: 1;
        }


        /* =========================
           TOP STATUS
        ========================= */

        .status {
            display: inline-block;

            border: 1px solid #3d3545;
            border-radius: 20px;

            padding: 7px 14px;

            margin-bottom: 35px;

            font-size: 11px;
            letter-spacing: 3px;

            color: #aaa3b0;

            text-transform: uppercase;
        }


        .status-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 7px;

            border-radius: 50%;

            background: #a75cff;
        }


        /* =========================
           PUMPKIN
        ========================= */

        .pumpkin {
            font-size: 64px;

            margin-bottom: 18px;

            filter:
                drop-shadow(0 0 18px rgba(255, 115, 0, 0.18));
        }


        /* =========================
           CHOSE TITLE
        ========================= */

        .choose-title {
            font-size: clamp(52px, 12vw, 90px);

            letter-spacing: 8px;

            margin: 0;

            font-weight: 800;
        }


        .full-name {
            margin-top: 12px;

            font-size: 13px;

            letter-spacing: 3px;

            color: #a9a2ae;

            line-height: 1.7;
        }


        /* =========================
           HALLOWEEN TITLE
        ========================= */

        .event {
            margin-top: 45px;
        }


        .event-title {
            font-size: clamp(25px, 6vw, 38px);

            letter-spacing: 4px;

            margin: 0;
        }


        .event-year {
            margin-top: 8px;

            font-size: 14px;

            letter-spacing: 5px;

            color: #9b52ed;
        }


        /* =========================
           TAGLINE
        ========================= */

        .tagline {
            margin: 32px auto 0;

            max-width: 480px;

            font-size: 17px;

            line-height: 1.6;

            color: #bbb4c0;

            font-style: italic;
        }


        /* =========================
           WARNING BOX
        ========================= */

        .warning {
            margin: 35px auto 0;

            max-width: 430px;

            padding: 13px 18px;

            border-left: 2px solid #8f4cff;

            background: rgba(143, 76, 255, 0.05);

            text-align: left;

            font-size: 12px;

            line-height: 1.6;

            color: #8f8792;
        }


        .warning strong {
            color: #bca8d0;

            letter-spacing: 1px;
        }


        /* =========================
           BUTTON
        ========================= */

        .enter-button {
            display: inline-block;

            margin-top: 42px;

            padding: 17px 38px;

            border: 1px solid #8f4cff;
            border-radius: 10px;

            background: #8f4cff;

            color: white;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 2px;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s,
                box-shadow 0.2s;
        }


        .enter-button:hover {
            background: #a76cff;

            box-shadow:
                0 0 25px rgba(143, 76, 255, 0.3);

            transform: translateY(-2px);
        }


        .enter-button:active {
            transform: scale(0.97);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 20px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 10px;

            letter-spacing: 2px;

            color: #514b55;
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 480px) {

            .cover {
                padding: 25px 20px 65px;
            }

            .status {
                margin-bottom: 28px;

                font-size: 9px;

                letter-spacing: 2px;
            }

            .pumpkin {
                font-size: 55px;
            }

            .choose-title {
                letter-spacing: 5px;
            }

            .full-name {
                font-size: 10px;

                letter-spacing: 2px;
            }

            .event {
                margin-top: 35px;
            }

            .event-title {
                letter-spacing: 2px;
            }

            .event-year {
                font-size: 12px;

                letter-spacing: 4px;
            }

            .tagline {
                font-size: 15px;
            }

            .warning {
                font-size: 11px;
            }

            .enter-button {
                width: 100%;
                max-width: 310px;
            }

        }

    </style>

</head>


<body>


    <main class="cover">

        <div class="cover-content">


            <div class="status">
                <span class="status-dot"></span>
                Research Facility Online
            </div>


            <div class="pumpkin">
                🎃
            </div>


            <h1 class="choose-title">
                C.H.O.S.E.
            </h1>


            <div class="full-name">

                CENTER FOR HYBRID AND<br>
                ORGANIC SOLAR ENERGY

            </div>


            <div class="event">

                <h2 class="event-title">
                    HALLOWEEN NIGHT
                </h2>

                <div class="event-year">
                    2026
                </div>

            </div>


            <p class="tagline">

                Where solar energy meets
                questionable decisions.

            </p>


            <div class="warning">

                <strong>⚠ WARNING</strong><br>

                Experimental activities may cause
                unexpected levels of competition.

            </div>


            <a href="#" class="enter-button">

                ENTER THE LAB →

            </a>


        </div>


        <div class="footer">

            C.H.O.S.E. // HALLOWEEN RESEARCH PROGRAM

        </div>


    </main>


</body>

</html>
