<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.H.O.S.E. | Researcher Registration</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="quiz-page">
        <div class="quiz-container">

            <div class="quiz-header">
                <div class="quiz-label">C.H.O.S.E. // EXPERIMENT 01</div>
                <h1>📝 RESEARCHER REGISTRATION</h1>
                <p>Tell us who is coming to the lab on Halloween night.</p>
            </div>

            <form id="form">

                <div class="field">
                    <label for="nome">First name</label>
                    <input type="text" id="nome" name="nome" required autocomplete="given-name">
                </div>

                <div class="field">
                    <label for="cognome">Last name</label>
                    <input type="text" id="cognome" name="cognome" required autocomplete="family-name">
                </div>

                <div class="field">
                    <label for="restrizioni">Food restrictions or allergies</label>
                    <textarea id="restrizioni" name="restrizioni" rows="2" placeholder="Leave empty if none"></textarea>
                </div>

                <div class="field">
                    <label>Will you drink alcohol?</label>
                    <div class="choices">
                        <label class="choice"><input type="radio" name="alcol" value="si" required> Yes</label>
                        <label class="choice"><input type="radio" name="alcol" value="no"> No</label>
                    </div>
                </div>

                <div class="field">
                    <label>Do you want to join the games (beer pong and more)?</label>
                    <div class="choices">
                        <label class="choice"><input type="radio" name="giochi" value="si" required> Yes</label>
                        <label class="choice"><input type="radio" name="giochi" value="forse"> Maybe</label>
                        <label class="choice"><input type="radio" name="giochi" value="no"> No</label>
                    </div>
                </div>

                <div class="field">
                    <label>Are you bringing a +1?</label>
                    <div class="choices">
                        <label class="choice"><input type="radio" name="plusUno" value="si" required> Yes</label>
                        <label class="choice"><input type="radio" name="plusUno" value="no"> No</label>
                    </div>
                </div>

                <div id="plusBox" hidden>

                    <div class="plus-title">YOUR +1</div>

                    <div class="field">
                        <label for="piuNome">+1 first name</label>
                        <input type="text" id="piuNome" name="piuNome">
                    </div>

                    <div class="field">
                        <label for="piuCognome">+1 last name</label>
                        <input type="text" id="piuCognome" name="piuCognome">
                    </div>

                    <div class="field">
                        <label for="piuRestrizioni">+1 food restrictions or allergies</label>
                        <textarea id="piuRestrizioni" name="piuRestrizioni" rows="2" placeholder="Leave empty if none"></textarea>
                    </div>

                    <div class="field">
                        <label>Will your +1 drink alcohol?</label>
                        <div class="choices">
                            <label class="choice"><input type="radio" name="piuAlcol" value="si"> Yes</label>
                            <label class="choice"><input type="radio" name="piuAlcol" value="no"> No</label>
                        </div>
                    </div>

                    <div class="field">
                        <label>Will your +1 join the games?</label>
                        <div class="choices">
                            <label class="choice"><input type="radio" name="piuGiochi" value="si"> Yes</label>
                            <label class="choice"><input type="radio" name="piuGiochi" value="forse"> Maybe</label>
                            <label class="choice"><input type="radio" name="piuGiochi" value="no"> No</label>
                        </div>
                    </div>

                </div>

                <div class="quiz-bottom">
                    <button type="submit" class="next" id="submit">REGISTER</button>
                    <div class="form-message" id="message" hidden></div>
                </div>

            </form>

            <a href="experiments.html" class="back-button">← RETURN TO EXPERIMENTS</a>

        </div>
    </main>

    <script src="js/form.js"></script>
</body>

</html>
