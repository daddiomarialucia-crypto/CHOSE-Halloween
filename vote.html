<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.H.O.S.E. | Best Costume</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="quiz-page">
        <div class="quiz-container">

            <div class="quiz-header">
                <div class="quiz-label">C.H.O.S.E. // EXPERIMENT 03</div>
                <h1>🏆 BEST COSTUME</h1>
                <p>One vote each. Choose wisely.</p>
            </div>

            <div id="content">

                <div class="field">
                    <label>Who are you? (as registered)</label>
                    <div class="name-grid">
                        <input type="text" id="voterNome" placeholder="First name" autocomplete="given-name">
                        <input type="text" id="voterCognome" placeholder="Last name" autocomplete="family-name">
                    </div>
                </div>

                <div class="field">
                    <input type="text" id="search" placeholder="Search by name or costume...">
                </div>

                <div class="answers" id="list">
                    <div class="empty">Loading contestants...</div>
                </div>

                <div class="vote-bar">
                    <div class="picked" id="picked">Tap a name to choose</div>
                    <button type="button" class="next" id="vote" disabled>VOTE</button>
                    <div class="form-message" id="message" hidden></div>
                </div>

            </div>

            <a href="experiments.html" class="back-button">← RETURN TO EXPERIMENTS</a>

        </div>
    </main>

    <script src="js/vote.js"></script>
</body>

</html>
